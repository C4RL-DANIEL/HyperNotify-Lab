name: Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Verify Flutter configuration
        run: flutter doctor -v

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Build Debug APK with Flutter
        run: |
          flutter build apk --debug --no-tree-shake-icons

      - name: Verify APK exists
        run: |
          ls -la build/app/outputs/flutter-apk/app-debug.apk
          test -f build/app/outputs/flutter-apk/app-debug.apk

      - name: Get APK info
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          echo "APK_SIZE=$(stat -c%s "$APK_PATH")" >> $GITHUB_ENV
          echo "APK_SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)" >> $GITHUB_ENV

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperNotify-Lab-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
          compression-level: 6

  notify:
    name: Notify Status
    needs: [build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ Build passed!"
            echo "BUILD_STATUS=success" >> $GITHUB_ENV
          else
            echo "❌ Build failed"
            echo "BUILD_STATUS=failure" >> $GITHUB_ENV
          fi

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ env.BUILD_STATUS }}" == "success" ]; then
            echo "### ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
            echo "- APK: \`build/app/outputs/flutter-apk/app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
            echo "- Size: ${{ env.APK_SIZE }} bytes" >> $GITHUB_STEP_SUMMARY
            echo "- SHA256: ${{ env.APK_SHA256 }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Download**: [Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
          fi