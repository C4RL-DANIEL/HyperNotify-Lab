name: Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Install Android 16 platform (API 36)
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || echo "sdkmanager install failed, continuing"
          ls $ANDROID_SDK_ROOT/platforms/ 2>/dev/null | head

      - name: Inspect ProgressStyle API
        run: |
          JAR="$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          echo "jar exists: $(test -f "$JAR" && echo yes || echo no)"
          javap -classpath "$JAR" 'android.app.Notification$ProgressStyle' || echo "javap failed"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperNotify-Lab-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
          if-no-files-found: error

      - name: Copy APK to root
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk HyperNotify-Lab-debug.apk

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: HyperNotify Lab v1.0.0
          body: |
            ## HyperNotify Lab v1.0.0

            **Xiaomi HyperOS Tablet Hyper Island Notification Tester**

            ✅ APK built successfully in GitHub Actions!

            ### 📦 Download APK
            - **HyperNotify-Lab-debug.apk** (attached to this release)

            ### Download Source Code
            - [Source ZIP](https://github.com/${{ github.repository }}/archive/refs/tags/v1.0.0.zip)
            - Clone: `git clone https://github.com/${{ github.repository }}.git`

            ### App Details
            - Package: `com.hypernotify.lab`
            - Min Android: 10 (API 29)
            - Target Android: 14 (API 34)
          files: HyperNotify-Lab-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}