name: Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperNotify-Lab-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

  notify:
    name: Notify
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ Build passed! APK available in artifacts."
          else
            echo "❌ Build failed"
          fi