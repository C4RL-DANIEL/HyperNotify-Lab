name: Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Build APK
        run: |
          flutter build apk --debug

      - name: Find and Upload APK
        run: |
          echo "Searching for APK files..."
          find . -name "*.apk" -type f 2>/dev/null
          APK_PATH=$(find . -name "app-debug.apk" -type f 2>/dev/null | head -1)
          echo "Found APK at: $APK_PATH"
          if [ -z "$APK_PATH" ]; then
            echo "No APK found!"
            exit 1
          fi
          ls -la "$APK_PATH"
          test -f "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Get APK info
        id: apk_info
        run: |
          APK_PATH=$(find . -name "app-debug.apk" -type f 2>/dev/null | head -1)
          SIZE=$(stat -c%s "$APK_PATH")
          SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          echo "APK_SIZE=$SIZE" >> $GITHUB_OUTPUT
          echo "APK_SHA256=$SHA256" >> $GITHUB_OUTPUT
          echo "APK_PATH=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperNotify-Lab-debug
          path: ${{ env.APK_PATH }}
          retention-days: 30
          compression-level: 6
          if-no-files-found: error

  notify:
    name: Notify
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ Build passed! APK available in artifacts."
          else
            echo "❌ Build failed"
          fi