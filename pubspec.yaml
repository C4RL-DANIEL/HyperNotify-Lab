name: hyper_notify_lab
description: "Xiaomi HyperOS Tablet Hyper Island Notification Tester"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_local_notifications: ^17.1.2
  permission_handler: ^11.3.1
  android_intent_plus: ^5.2.1
  workmanager: ^0.5.2
  shared_preferences: ^2.2.3
  device_info_plus: ^10.1.0
  url_launcher: ^6.2.5
  timezone: ^0.9.3
  flutter_riverpod: ^2.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true